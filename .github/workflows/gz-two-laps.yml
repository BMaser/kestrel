name: gz two laps

# Two laps of the hard race course (tracks/hard_race_v1.json, scale 4) in PX4 v1.17.0 SITL + Gazebo Harmonic, x500 with one forward nose camera,
# MAVSDK offboard setpoints, live lap counter, films made on the runner. Free runner: 4 cores, no graphics card (Xvfb + Mesa software drawing).
# See sim/gz_px4/fly.py. Nothing of this runs on the owner's PC.

on:
  push:
    branches: [gz-two-laps, ui-window]
  workflow_dispatch:
    inputs:
      ui:
        description: "Also open Gazebo's window and QGroundControl on the runner's virtual screen and film that screen (ui_screen.mp4)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PX4_TAG: v1.17.0

jobs:
  fly:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      UI: ${{ (github.event_name == 'push' && github.ref_name == 'ui-window') || inputs.ui == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests (course, route, world, analysis)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy
          for t in test_course test_route test_world test_analysis; do timeout 300 /usr/bin/python3 -I tests/$t.py; done
          /usr/bin/python3 -m py_compile colab/*.py sim/gz_px4/*.py
          /usr/bin/python3 -c "import json; nb = json.load(open('colab/Kestrel_UI_PX4_Gazebo_QGroundControl.ipynb')); print('notebook ok,', len(nb['cells']), 'cells')"

      - name: Restore the built PX4 checkout
        id: px4cache
        uses: actions/cache/restore@v4
        with:
          path: px4
          key: px4-${{ env.PX4_TAG }}-sitl-gz-v1

      - name: Get PX4-Autopilot
        if: steps.px4cache.outputs.cache-hit != 'true'
        run: git clone --branch "$PX4_TAG" --depth 1 --recurse-submodules --shallow-submodules https://github.com/PX4/PX4-Autopilot.git px4

      - name: Install tools, Gazebo Harmonic, ffmpeg, matplotlib and MAVSDK
        run: |
          set -e
          mkdir -p results
          git -C px4 rev-parse HEAD | tee results/px4_version.txt
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 ffmpeg
          bash px4/Tools/setup/ubuntu.sh --no-nuttx
          sudo apt-get install -y python3-gz-transport13 python3-gz-msgs10 python3-numpy python3-scipy python3-matplotlib python3-venv
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install 'mavsdk<4' numpy scipy matplotlib
          .venv/bin/python -c "import mavsdk, numpy, scipy, matplotlib; from gz.transport13 import Node; from gz.msgs10.pose_v_pb2 import Pose_V; from gz.msgs10.image_pb2 import Image; print('mavsdk', mavsdk.__file__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'matplotlib', matplotlib.__version__, 'gz bindings ok')" | tee results/python_versions.txt
          gz sim --versions | tee results/gz_version.txt
          ffmpeg -version | head -n 1

      - name: Build PX4 SITL
        if: steps.px4cache.outputs.cache-hit != 'true'
        run: |
          (cd px4 && make px4_sitl_default) > results/build.log 2>&1 || { tail -n 80 results/build.log; exit 1; }
          tail -n 3 results/build.log

      - name: Save the built PX4 checkout
        if: steps.px4cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: px4
          key: px4-${{ env.PX4_TAG }}-sitl-gz-v1

      - name: Fly two laps, make the films and result.json
        id: fly
        timeout-minutes: 55
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          EXTRA=""
          if [ "$UI" = "true" ]; then
            # the same desktop as the Colab UI notebook (colab/ui_desktop.py, colab/ui_qgc.py), without VNC: Gazebo's window + QGroundControl
            sudo apt-get install -y --no-install-recommends fluxbox libfuse2 gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl \
              libxcb-xinerama0 libxkbcommon-x11-0 libxcb-cursor0 libegl1 libpulse-mainloop-glib0 > results/ui_apt.log 2>&1 || true
            Xvfb :1 -screen 0 1600x900x24 -ac +extension GLX +render -noreset > results/ui_xvfb.log 2>&1 &
            sleep 3
            DISPLAY=:1 fluxbox > results/ui_fluxbox.log 2>&1 &
            url=$(curl -s https://api.github.com/repos/mavlink/qgroundcontrol/releases/latest | grep -o '"browser_download_url": *"[^"]*\.AppImage"' | grep -o 'https[^"]*' | grep -E 'x86_64|amd64' | head -n 1)
            echo "QGroundControl: $url" | tee results/qgc_version.txt
            mkdir -p qgc && (cd qgc && wget -q -O QGC.AppImage "$url" && chmod +x QGC.AppImage && ./QGC.AppImage --appimage-extract > /dev/null) || echo "QGC download failed" >> results/qgc_version.txt
            DISPLAY=:1 LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb setsid qgc/squashfs-root/AppRun > results/qgc_run.log 2>&1 &
            ffmpeg -loglevel error -f x11grab -framerate 2 -video_size 1600x900 -i :1 -c:v libx264 -pix_fmt yuv420p results/ui_screen.mp4 > results/ui_ffmpeg.log 2>&1 &
            echo $! > ui_ffmpeg.pid
            EXTRA="--gui-display :1 --flight-timeout-min 45"
          fi
          rc=0
          .venv/bin/python -m sim.gz_px4.fly --px4 px4 --out results $EXTRA 2>&1 | tee results/run.log || rc=$?
          if [ -f ui_ffmpeg.pid ]; then
            ffmpeg -loglevel error -f x11grab -video_size 1600x900 -i :1 -frames:v 1 results/ui_end.png || true
            pgrep -fa 'QGroundControl|gz sim' > results/ui_processes_at_end.txt || true
            kill -INT "$(cat ui_ffmpeg.pid)"; sleep 5
            ffmpeg -loglevel error -i results/ui_screen.mp4 -vf "fps=1/20,scale=800:-1,tile=3x3" -frames:v 1 results/ui_contact.png || true
          fi
          exit $rc

      - name: Job summary
        if: always()
        run: |
          if [ -f results/result.json ]; then
            python3 -c "import json; r=json.load(open('results/result.json')); print('### gz two laps\n'); print('passed:', r.get('passed')); print('checks:', json.dumps(r.get('checks'), indent=1)); print('gates', r.get('gates_passed'), 'lap times', r.get('lap_times_s'), 'rtf', r.get('real_time_factor'), 'camera fps', r.get('camera_fps'))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No result.json (fly step: ${{ steps.fly.outcome }})." >> "$GITHUB_STEP_SUMMARY"
          fi
          df -h / | tail -n 1

      - name: Keep the tail of the simulator log, drop big files
        if: always()
        run: |
          for f in results/sim.log; do [ -f "$f" ] && tail -n 600 "$f" > results/sim_tail.log && if [ "$(stat -c %s "$f")" -gt 20000000 ]; then rm -f "$f"; fi; done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gz-two-laps-results
          path: results/
          if-no-files-found: warn

      - name: Fail the job when the flight failed
        if: always()
        run: test "${{ steps.fly.outcome }}" = success
