name: tests
on:
  push:
    branches-ignore: [gz-two-laps]   # that branch runs these tests inside .github/workflows/gz-two-laps.yml (one run per push)
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - run: timeout 300 python -I tests/test_course.py
      - run: timeout 300 python -I tests/test_route.py
      - run: timeout 300 python -I tests/test_world.py
      - run: timeout 300 python -I tests/test_analysis.py
